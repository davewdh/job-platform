name: job-platform

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${JOB_DATABASE_PASSWORD:-yourpassword}
      POSTGRES_DB: jobplatform
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobplatform"]
      interval: 5s
      timeout: 3s
      retries: 12

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "cub", "zk-ready", "localhost:2181", "5"]
      interval: 5s
      timeout: 8s
      retries: 12

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 10s

  backend:
    build: ../backend
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      JOB_DATABASE_URL: jdbc:postgresql://postgres:5432/jobplatform
      JOB_DATABASE_PASSWORD: ${JOB_DATABASE_PASSWORD:-yourpassword}
      JOB_KAFKA_SERVERS: kafka:29092
      JOB_FRONTEND_ORIGIN: http://localhost:${JOB_FRONTEND_PORT:-3000}
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build: ../frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${JOB_FRONTEND_PORT:-3000}:80"

volumes:
  pgdata:
